<!DOCTYPE html>
<html lang="fr">
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/c498013e5e.js" crossorigin="anonymous"></script>
    <title>Fisheye - photographe </title>
  </head>
  <body>
    <header role="banner">
      <a href="index.html" tabindex="0" aria-label="Lien vers la page d'accueil">
        <img src="assets/images/logo.png" class="logo" alt="Fisheye logo"/>
      </a>
    </header>

    <main id="main" role="main">
    <!-- Header -->
      <section class="photograph-header">
        <button class="contact_button" role="button" onclick="displayModal()" tabindex="1">Contactez-moi</button>
      </section>

    <!-- Filters -->
      <section class="filter__container">
        <label for="filter" class="filter__label">Trier par</label>
        <select name="filter" id="filter" class="filter" tabindex="2">
          <option value="Date">Date</option>
          <option value="Popularité">Popularité</option>
          <option value="Titre">Titre</option>
        </select>
      </section>

    <!-- Medias -->
      <section class="photographer_medias"></section>

    <!-- Total likes + prices -->
      <div class="tarifs__container">
        <div>
          <p class="like_counter" aria-live="polite" aria-label="Nombre total de likes"></p>
        </div>
        <div>
          <p class="tarifs" aria-label="Tarif journalier du photographe"></p>
        </div>
      </div>
    </main>

    <!-- Contact Modal -->
    <div class="contact_modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal_title">
			<div class="modal">
				<header>
          <div class="modal_header_title">
            <h2 id="modal_title" class="sr-only">Contacter le photographe</h2>
            <h2 class="modal_title">Contactez-moi</h2>
          </div>

          <button class="button" onclick="closeModal()">
            <img src="assets/icons/close.svg" id="modal_close_button" alt="Fermer la modal de contact"/>
          </button>
        </header>
				<form id="form">
					<div>
						<label for="fname">Prénom</label>
						<input type="text" id="fname" name="fname"/>
					</div>
          <div>
						<label for="lname">Nom</label>
						<input type="text" id="lname" name="lname"/>
					</div>
          <div>
						<label for="email">Email</label>
						<input type="email" id="email" name="email"/>
					</div>
          <div>
						<label for="message">Votre message</label>
						<textarea id="message" name="message" rows="10" cols="76"></textarea>
					</div>
          <button class="submit_button" type="submit" form="form" value="Submit" role="button">Envoyer</button>
				</form>
			</div>
		</div>

    <!-- Lightbox -->
    <div class="lightbox__container" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lightbox-title">
      <h2 id="lightbox-title" class="sr-only">Visualisation du média</h2>
			<div class="lightbox__modal">
        <button class="button" aria-label="Média précédent" onclick="prevMedia()">
          <span class="fa-sharp fa-solid fa-angle-left lightbox__prev"></span>
        </button>  

      <div class="lightbox__medias"></div>    

        <button class="button" aria-label="Média suivant" onclick="nextMedia()">
          <span class="fa-sharp fa-solid fa-angle-right lightbox__next"></span>
        </button>

        <button class="modal_close_button button" onclick="closeLightbox()">
          <img src="assets/icons/close_lightbox.svg" alt="Fermer la lightbox" />
        </button>
			</div>
		</div>

    <script src="/scripts/utils/lightbox.js"></script>
    <script src="/scripts/pages/photographer.js"></script>
    <script src="/scripts/utils/contactForm.js"></script>

  </body>
</html>
